services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    image: auth-service:latest
    env_file:
      - environment/postgres.env
      - environment/jwt.env
      - environment/oauth2.env
      - environment/redis.env
    ports:
      - 8080:8080

  postgres:
    image: postgres:16.1
    container_name: postservice-postgres
    env_file:
      - environment/postgres.env
    ports:
      - 5432:5432

  redis:
    image: redis:7.2.4
    container_name: auth-redis
    #    env_file: todo added password
    #      - environment/redis.env
    #    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    ports:
      - 6379:6379