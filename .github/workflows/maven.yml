name: Java CI with Maven

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check-step.outputs.skip }}
    steps:
      - name: Check author and branch
        id: check-step
        run: |
          echo "Actor: ${{ github.actor }}"
          echo "Ref: ${{ github.ref }}"
          
          if [ "${{ github.actor }}" = "github-actions[bot]" ] || [[ "${{ github.ref }}" == "refs/heads/release-please--branches--develop" ]]; then
            echo "Detected bot push or release-please branch — skipping CI."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "CI should run."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.skip == 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (skip tests)
        run: mvn -B package -DskipTests --file pom.xml

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: target/
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    needs: build
    if: needs.check.outputs.skip == 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: starting test
        run: mvn clean test
